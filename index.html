<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Drives You? | PSY1110</title><style>:root{--bg:#f5f7fa;--card:#fff;--text:#17212b;--muted:#5d6975;--border:#d9e0e7;--accent:#2f5f85;--accent2:#eaf2f8;--bar:#597b95}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.55}main{max-width:900px;margin:auto;padding:28px 18px 48px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px}.top{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:.92rem;margin-bottom:12px}.progress{height:9px;background:#edf1f4;border-radius:999px;overflow:hidden;margin-bottom:28px}.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}h1,h2,h3{line-height:1.2}h1{font-size:2rem}h2{font-size:1.55rem}.note,.feedback{background:var(--accent2);border-radius:12px;padding:15px;margin:16px 0}.options{display:grid;gap:11px;margin-top:18px}button{font:inherit}.choice,.primary,.secondary{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-height:50px;background:#fff;cursor:pointer;text-align:left}.choice:hover,.choice:focus,.secondary:hover,.secondary:focus{background:#f4f7f9}.choice:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #8ab4d4;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center;font-weight:700;margin-top:18px}.secondary{text-align:center;margin-top:18px}.map{display:grid;gap:14px;margin:22px 0}.metric-head{display:flex;justify-content:space-between;gap:12px;font-size:.93rem;margin-bottom:5px}.track{height:13px;background:#edf1f4;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--bar);border-radius:999px}.result-box{border:1px solid var(--border);border-radius:12px;padding:16px;margin:18px 0}.footer{font-size:.82rem;color:var(--muted);margin-top:18px;text-align:center}@media(max-width:600px){main{padding:14px 10px 32px}.card{padding:19px}.top{flex-direction:column;gap:3px}h1{font-size:1.65rem}}@media(prefers-reduced-motion:reduce){.progress>div{transition:none}}</style></head><body><main><section class="card"><div class="top"><span id="progressLabel">Interactive psychology simulation</span><span id="stepLabel">Start</span></div><div class="progress" aria-hidden="true"><div id="progressBar"></div></div><div id="screen" aria-live="polite"></div></section><div class="footer">PSY1110 learning activity • No responses are transmitted or stored after the browser session ends.</div></main><script>
(function(){const screen=document.getElementById('screen'),bar=document.getElementById('progressBar'),stepLabel=document.getElementById('stepLabel'),progressLabel=document.getElementById('progressLabel');const d={intrinsic:0,extrinsic:0,physiological:0,achievement:0,affiliation:0,efficacy:0},labels={intrinsic:'Intrinsic motivation',extrinsic:'External incentives',physiological:'Physiological needs',achievement:'Achievement',affiliation:'Affiliation & connection',efficacy:'Self-efficacy & persistence'};const steps=[
{title:'The Goal',kicker:'Decision 1',text:'You have an important psychology exam coming up. Doing well matters to you, but you have plenty of other demands on your time. What would most strongly make you want to prepare?',opts:[['I genuinely want to understand the material and master it.',{intrinsic:3,achievement:1},'Personal interest and mastery are carrying much of the motivational weight here.'],['I want the strongest grade I can earn.',{extrinsic:3,achievement:2},'The outcome matters. Grades can function as meaningful external incentives while also supporting achievement goals.'],['I really do not want the consequences of doing poorly.',{extrinsic:3},'Avoiding an undesirable outcome can be a powerful external influence on behavior.'],['I want to prove to myself that I can succeed.',{achievement:3,efficacy:2},'Achievement and beliefs about capability are central to this choice.']]},
{title:'Competing Needs',kicker:'Decision 2',text:'You planned to study, but you are exhausted and hungry. Someone important to you also wants to spend time together. You realistically cannot do everything. What do you do first?',opts:[['Study anyway. The academic goal takes priority.',{achievement:3,extrinsic:1},'Your achievement goal remains highly salient even while other needs compete for your behavior.'],['Eat and rest. I am too depleted to accomplish much right now.',{physiological:4},'Biological states can redirect behavior even when another goal remains important.'],['Spend time with the person. That relationship matters too.',{affiliation:4},'Social connection is itself a meaningful human motive, not simply a distraction from other goals.'],['Try to fit all three in somehow.',{achievement:1,physiological:1,affiliation:1},'Several motives are competing, and your response attempts to accommodate all of them rather than allowing one to dominate.']]},
{title:'The Incentive',kicker:'Decision 3',text:'Now imagine someone offers you $100 if you earn an A. You already had reasons for wanting to do well. What happens to your motivation?',opts:[['I would work harder. The reward definitely matters.',{extrinsic:4,achievement:1},'A new external incentive has increased the value of the outcome.'],['It would not change much. I already want to understand the material.',{intrinsic:4},'The external reward has relatively little effect because the activity already carries internal value.'],['It might shift my attention from learning to earning the reward.',{intrinsic:2,extrinsic:2},'You are noticing that internal and external sources of motivation can interact rather than simply add together.'],['It matters, but so do all the other reasons I want to succeed.',{extrinsic:2,achievement:2,intrinsic:1},'Multiple motives can operate simultaneously; adding an incentive does not erase the motivations already present.']]},
{title:'Your Learning History',kicker:'Decision 4',learn:true,text:'You realize you are behind. Then you remember that the last time you waited until the last minute to study, you still earned a surprisingly good grade. What thought is most likely to influence you?',opts:[['It worked last time. I can probably wait again.',{extrinsic:2},'A previous desirable consequence may increase the likelihood of repeating the behavior. Your learning history has entered the motivational situation.'],['That result does not guarantee it will work again. I will start now.',{achievement:2,efficacy:1},'You are resisting the pull of a previously rewarded behavior in favor of the current goal.'],['I will do a little now and see how I feel afterward.',{achievement:1,physiological:1},'Your behavior is being adjusted in response to both the goal and your current state.'],['I would think about what actually caused the good grade last time before deciding.',{efficacy:2,achievement:1},'You are evaluating the previous outcome rather than assuming that one successful consequence proves the same strategy will work again.']]},
{title:'The Setback',kicker:'Decision 5',text:'You take a practice quiz and score 58%. You expected to do much better. What is your most likely response?',opts:[['I clearly do not understand this. I am probably going to fail.',{efficacy:-1,physiological:1},'A setback can reduce perceived capability and change whether continued effort feels worthwhile.'],['That was rough, but now I know what I need to work on.',{efficacy:4,achievement:2},'The setback becomes information rather than proof of inability, supporting continued effort and persistence.'],['I need a different strategy or some help.',{efficacy:3,achievement:2,affiliation:1},'Seeking another strategy reflects continued belief that action can improve performance.'],['I am frustrated. I need a short break before deciding what to do.',{physiological:1,efficacy:1},'Emotion has become part of the motivational system. Stepping away does not necessarily mean abandoning the goal.']]},
{title:'Other People Matter',kicker:'Decision 6',text:'A friend invites you out. At the same time, a classmate asks whether you want to study together. You could also work alone. Which option is most appealing?',opts:[['Go out with friends. Maintaining those relationships matters.',{affiliation:4},'Affiliation and belonging can compete directly with achievement goals.'],['Study with the classmate.',{affiliation:3,achievement:3,efficacy:1},'One behavior can serve several motives at once: social connection, achievement, and potentially greater confidence.'],['Study alone. I want to focus completely on the goal.',{achievement:4,intrinsic:1},'Achievement is taking priority over the competing social opportunity.'],['Stop for now. I am mentally exhausted.',{physiological:3},'Internal physical and mental states can alter which goals are most capable of directing behavior.']]},
{title:'Emotion Enters the Picture',kicker:'Decision 7',emotion:true,text:'Just before the exam, your heart is beating faster and your body feels activated. Which interpretation comes closest to how you might experience that state?',opts:[['I am anxious. This is going to go badly.',{efficacy:-1},'Physiological arousal is being interpreted within a threatening frame, contributing to the emotional experience.'],['I am energized. My body is getting ready to perform.',{efficacy:3,achievement:1},'The arousal is similar, but the interpretation is different. Context and appraisal help shape emotional experience.'],['I feel activated, but I am not sure yet whether it is anxiety or excitement.',{efficacy:1},'Bodily arousal alone does not necessarily specify a single emotional experience. Interpretation and context matter.'],['I would probably be focused on the task rather than labeling the feeling.',{achievement:2},'Attention can remain centered on the goal even while physiological arousal is present.']]}
];let idx=-1;function btn(t,f,c){const b=document.createElement('button');b.type='button';b.className=c||'choice';b.textContent=t;b.addEventListener('click',f);return b}function intro(){stepLabel.textContent='Start';progressLabel.textContent='Interactive psychology simulation';bar.style.width='0%';screen.innerHTML='<div class="eyebrow">Module 4 · Learning, Motivation & Emotion</div><h1>What actually drives your behavior?</h1><p>You are about to move through a series of decisions involving one academic goal. There are no “best” personal choices. Choose what you would realistically be most likely to do.</p><p>As circumstances change, different biological, psychological, and social influences will compete for your behavior. Your choices will build a <strong>Motivation Map</strong> that you will examine at the end.</p><div class="note"><strong>Important:</strong> This is a learning activity, not a psychological test or assessment. Your results describe choices within this simulated situation only.</div>';screen.appendChild(btn('Begin the simulation',()=>{idx=0;render()},'primary'))}function render(){const s=steps[idx];progressLabel.textContent=s.kicker;stepLabel.textContent=(idx+1)+' of '+steps.length;bar.style.width=(idx/steps.length*100)+'%';screen.innerHTML='<h2>'+s.title+'</h2><p>'+s.text+'</p>';const w=document.createElement('div');w.className='options';s.opts.forEach((o,i)=>w.appendChild(btn(o[0],()=>choose(i))));screen.appendChild(w)}function choose(i){const s=steps[idx],o=s.opts[i];Object.entries(o[1]).forEach(([k,v])=>d[k]+=v);bar.style.width=((idx+1)/steps.length*100)+'%';screen.innerHTML='<div class="eyebrow">What just happened?</div><h2>Your choice changed the motivational picture.</h2><p>'+o[2]+'</p>'+(s.learn?'<div class="feedback"><strong>Learning connection:</strong> When a behavior has previously been followed by a desirable consequence, that consequence can make similar behavior more likely in the future. Learning history therefore becomes part of later motivated behavior.</div>':'')+(s.emotion?'<div class="feedback"><strong>Emotion connection:</strong> Emotional experience can involve physiological arousal, interpretation, context, and behavior. Similar bodily activation does not necessarily produce the same emotional experience for everyone.</div>':'');screen.appendChild(btn(idx===steps.length-1?'See my Motivation Map':'Continue',()=>{idx++;idx<steps.length?render():results()},'primary'))}function results(){progressLabel.textContent='Your results';stepLabel.textContent='Complete';bar.style.width='100%';const ord=Object.entries(d).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...Object.values(d));let h='<div class="eyebrow">Your Motivation Map</div><h2>More than one thing was driving your behavior.</h2><p>These bars summarize the motivational influences represented by your choices in this simulation. They are <strong>not personality scores</strong>.</p><div class="map">';ord.forEach(([k,v])=>{const p=Math.max(4,Math.round(Math.max(0,v)/max*100)),lev=v>=7?'Strong influence':v>=4?'Moderate influence':'Present';h+='<div><div class="metric-head"><strong>'+labels[k]+'</strong><span>'+lev+'</span></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>'});h+='</div>';const top=ord.slice(0,2).map(x=>labels[x[0]].toLowerCase());h+='<div class="result-box"><h3>What your choices demonstrate</h3><p>In this situation, <strong>'+top[0]+'</strong> and <strong>'+top[1]+'</strong> were especially prominent. But your behavior was never driven by only one force. Biological states, goals, incentives, previous consequences, beliefs about capability, relationships, and emotion sometimes supported one another and sometimes competed.</p></div><div class="note"><h3>The larger psychological lesson</h3><p>Calling someone simply “motivated” or “unmotivated” can hide the processes actually shaping behavior. Psychology asks a better question: <strong>What is motivating this behavior under these conditions?</strong></p><p>Your experience also connected motivation with <strong>learning</strong>—because past consequences can shape later choices—and with <strong>emotion</strong>—because physiological arousal and interpretation can influence experience and action.</p></div><hr style="border:0;border-top:1px solid var(--border);margin:24px 0"><div class="eyebrow">Psychologist’s Debrief</div><p>Consider these three questions for your Canvas submission:</p><ol><li>Where did two motivational forces compete in your experience, and what were they?</li><li>How could a previous consequence influence a later behavior in this simulation?</li><li>Why is saying someone is simply “motivated” or “unmotivated” an incomplete psychological explanation?</li></ol>';screen.innerHTML=h;screen.appendChild(btn('Restart simulation',()=>{Object.keys(d).forEach(k=>d[k]=0);idx=-1;intro()},'secondary'))}intro()})();
</script></body></html>
